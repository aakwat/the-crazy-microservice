# Self-contained plugin: the browser UI. It holds no session; it forwards the gateway's cookie back to the gateway.
services:
  web:
    build: .
    image: crazy-ms/web:dev
    environment:
      API_URL: http://gateway:8080
    healthcheck:
      test: [
        "CMD",
        "/nodejs/bin/node",
        "-e",
        "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
      ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    stop_grace_period: 15s
    # Internal only: reached through the gateway, and calls nothing but the gateway.
    networks:
      - app

networks:
  app:
    internal: true
