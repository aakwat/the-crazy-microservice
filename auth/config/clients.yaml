# This project's OAuth clients. Another project plugs auth in by mounting its own file here.
auth:
  client:
    registrations:
      - id: gateway
        secret: ${AUTH_CLIENT_GATEWAY_SECRET}
        grant-types: [authorization_code, refresh_token]
        redirect-uris: [http://127.0.0.1:8080/bff/callback]
        post-logout-redirect-uris: [http://127.0.0.1:8080/bff/logged-out]
        scopes: [openid, email]
      - id: jobs
        secret: ${AUTH_CLIENT_JOBS_SECRET}
        grant-types: [client_credentials]
        scopes: [tickets.read]
      - id: notifications
        secret: ${AUTH_CLIENT_NOTIFICATIONS_SECRET}
        grant-types: [client_credentials]
        scopes: [accounts.read]
