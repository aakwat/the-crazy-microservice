spring:
  application:
    name: auth
  # Required from the environment; no defaults so a missing secret fails startup instead of using a weak one.
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_APP_USER}
    password: ${AUTH_DB_APP_PASSWORD}
  # Migrations run as the schema owner; the app user can only read and write rows.
  flyway:
    user: ${AUTH_DB_MIGRATOR_USER}
    password: ${AUTH_DB_MIGRATOR_PASSWORD}
  # Unknown JSON fields are a 400, not silently dropped, so mass-assignment attempts are visible.
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      authorizationserver:
        # Fixed, not derived from the request Host, so every replica and every caller sees the same iss.
        issuer: ${AUTH_ISSUER}

server:
  # Only the gateway reaches auth, and it sets X-Forwarded-* from config, so redirects carry the public origin.
  forward-headers-strategy: framework

auth:
  account:
    default-role: ${AUTH_DEFAULT_ROLE:customer}
  login:
    lockout:
      max-failures: ${AUTH_LOCKOUT_MAX_FAILURES:5}
      duration: ${AUTH_LOCKOUT_DURATION:15m}
    attempt-retention: ${AUTH_ATTEMPT_RETENTION:90d}
  token:
    audience: ${AUTH_AUDIENCE:crazy-ms}
    access-ttl: ${AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-ttl: ${AUTH_REFRESH_TOKEN_TTL:8h}
  key:
    private-path: ${AUTH_PRIVATE_KEY_PATH}
    public-path: ${AUTH_PUBLIC_KEY_PATH}
  # auth.client.registrations is project-specific: supply it through an imported file (see compose.yaml).

management:
  endpoint:
    health:
      probes:
        enabled: true
