# Dev-only override (pass with -f) so a browser can reach the login page before the gateway exists.
services:
  auth:
    environment:
      AUTH_ISSUER: http://localhost:9000
      # A short lock so the lockout can be tried by hand without waiting 15 minutes.
      AUTH_LOCKOUT_DURATION: 1m
    ports:
      - "127.0.0.1:9000:8080"
    # Internal-only networks cannot publish ports, so dev mode adds one non-internal network (and with it egress).
    networks:
      - dev-edge

networks:
  dev-edge: {}
